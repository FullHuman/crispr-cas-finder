[package]
name = "hmmer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HMMER command-line tools"

[dependencies]
hmmer-core = { path = "../hmmer-core" }
hmmer-io = { path = "../hmmer-io" }
clap = { version = "4", features = ["derive"] }
rayon = "1.11"

[[bin]]
name = "hmmsearch"
path = "src/bin/hmmsearch.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hmmsearch_compare"
harness = false
