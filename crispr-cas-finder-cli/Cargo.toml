[package]
name = "crispr-cas-finder-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "CLI for CRISPR-Cas detection"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
bio = "4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
crispr-cas-finder-core = { path = "../crispr-cas-finder-core" }

[[bin]]
name = "crispr-cas-finder"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "crispr_cas_finder_cli_ecoli"
harness = false

[[bench]]
name = "crispr_cas_finder_compare"
harness = false
