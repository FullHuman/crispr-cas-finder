name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish (crispr-cas-finder-core, crispr-cas-finder-cli, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - crispr-cas-finder-core
          - crispr-cas-finder-cli
          - all
      dry_run:
        description: "Perform a dry run (no actual publishing)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: Publish Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify versions match
        run: |
          CORE_VERSION=$(grep '^version = ' crispr-cas-finder-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CLI_VERSION=$(grep '^version = ' crispr-cas-finder-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "crispr-cas-finder-core version: $CORE_VERSION"
          echo "crispr-cas-finder-cli version: $CLI_VERSION"

      - name: Run tests
        run: cargo test --all

      - name: Publish crispr-cas-finder-core
        if: inputs.crate == 'crispr-cas-finder-core' || inputs.crate == 'all'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crispr-cas-finder-core
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run
          else
            cargo publish
          fi

      - name: Wait for crispr-cas-finder-core to be available
        if: (inputs.crate == 'all') && (inputs.dry_run != 'true')
        run: |
          echo "Waiting 30 seconds for crispr-cas-finder-core to be available on crates.io..."
          sleep 30

      - name: Publish crispr-cas-finder-cli
        if: inputs.crate == 'crispr-cas-finder-cli' || inputs.crate == 'all'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crispr-cas-finder-cli
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run
          else
            cargo publish
          fi

      - name: Create summary
        run: |
          echo "### Published Crates" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.crate }}" = "all" ] || [ "${{ inputs.crate }}" = "crispr-cas-finder-core" ]; then
            echo "- ✅ crispr-cas-finder-core" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.crate }}" = "all" ] || [ "${{ inputs.crate }}" = "crispr-cas-finder-cli" ]; then
            echo "- ✅ crispr-cas-finder-cli" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** This was a dry run. No packages were actually published." >> $GITHUB_STEP_SUMMARY
          fi
