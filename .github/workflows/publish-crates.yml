name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish (crispr-cas-finder-core, crispr-cas-finder-cli, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - crispr-cas-finder-core
          - crispr-cas-finder-cli
          - all
      dry_run:
        description: "Perform a dry run (no actual publishing)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: Publish Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify versions match
        run: python3 scripts/check_versions.py

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Verify distribution notices
        run: |
          python3 scripts/sync_release_metadata.py --check
          python3 scripts/package_public_crates.py

      - name: Publish public crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SELECTED_CRATE: ${{ inputs.crate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$SELECTED_CRATE" in
            all) packages=(-p crispr-cas-finder-core -p crispr-cas-finder-cli) ;;
            crispr-cas-finder-core|crispr-cas-finder-cli) packages=(-p "$SELECTED_CRATE") ;;
            *) echo "Unsupported public crate: $SELECTED_CRATE" >&2; exit 1 ;;
          esac
          options=(--locked)
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi
          # One invocation verifies unpublished workspace dependencies together.
          # Cargo handles dependency order and index availability when uploading.
          cargo publish --target-dir "$(mktemp -d)" "${options[@]}" "${packages[@]}"
          echo "- $SELECTED_CRATE (dry run: $DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"
