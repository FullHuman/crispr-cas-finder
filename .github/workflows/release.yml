name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.get_version.outputs.version }} \
            --title "Release ${{ steps.get_version.outputs.version }}" \
            --draft \
            --generate-notes

  build-cli-binaries:
    name: Build CLI Binaries
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: crispr-cas-finder-cli-x86_64-linux
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: crispr-cas-finder-cli-aarch64-linux
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: crispr-cas-finder-cli-x86_64-windows
            ext: ".exe"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: crispr-cas-finder-cli-x86_64-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            name: crispr-cas-finder-cli-aarch64-darwin
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install nightly-2026-07-29 --profile minimal
          rustup target add ${{ matrix.target }} --toolchain nightly-2026-07-29

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p crispr-cas-finder-cli

      - name: Verify release notices
        run: python scripts/sync_release_metadata.py --check

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p ${{ matrix.name }}
          cp target/${{ matrix.target }}/release/crispr-cas-finder ${{ matrix.name }}/crispr-cas-finder
          strip ${{ matrix.name }}/crispr-cas-finder || true
          cp LICENSE THIRD_PARTY_NOTICES.md README.md LIMITATIONS.md ${{ matrix.name }}/
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
          python3 scripts/check_release_archives.py ${{ matrix.name }}.tar.gz
          python3 scripts/test_cli_distribution.py ${{ matrix.name }}.tar.gz
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/crispr-cas-finder.exe ${{ matrix.name }}/crispr-cas-finder.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md, LIMITATIONS.md -Destination ${{ matrix.name }}/
          Compress-Archive -Path ${{ matrix.name }} -DestinationPath ${{ matrix.name }}.zip
          python scripts/check_release_archives.py ${{ matrix.name }}.zip
          python scripts/test_cli_distribution.py ${{ matrix.name }}.zip
          $hash = Get-FileHash -Algorithm SHA256 ${{ matrix.name }}.zip
          "$($hash.Hash.ToLower())  ${{ matrix.name }}.zip" | Out-File -Encoding ASCII ${{ matrix.name }}.zip.sha256

      - name: Upload Release Assets (Unix)
        if: matrix.os != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.version }} \
            ${{ matrix.name }}.tar.gz \
            ${{ matrix.name }}.tar.gz.sha256

      - name: Upload Release Assets (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload ${{ needs.create-release.outputs.version }} `
            ${{ matrix.name }}.zip `
            ${{ matrix.name }}.zip.sha256
