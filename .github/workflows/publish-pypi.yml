name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        required: false
        default: false
        type: boolean

jobs:
  build-wheels:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify release notices
        run: python scripts/sync_release_metadata.py --check
      - name: Install maturin
        run: python -m pip install "maturin>=1.9,<2"
      - name: Build Linux wheel on its native architecture
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
          args: --locked --release --out dist --interpreter python${{ matrix.python-version }}
          rust-toolchain: nightly-2026-07-29
          manylinux: auto
          working-directory: crispr-cas-finder-python
      - name: Build Windows or macOS wheel on its native architecture
        if: runner.os != 'Linux'
        working-directory: crispr-cas-finder-python
        run: maturin build --locked --release --out dist --interpreter python
      - name: Test installed wheel and inspect notices
        run: python scripts/test_python_wheel.py crispr-cas-finder-python/dist
      - name: Upload tested wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: crispr-cas-finder-python/dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install maturin
        run: python -m pip install "maturin>=1.9,<2"

      - name: Verify source distribution builds outside the checkout
        run: python scripts/test_python_distribution.py

      - name: Build sdist
        working-directory: crispr-cas-finder-python
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crispr-cas-finder-python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: sdist
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to TestPyPI
        if: inputs.test_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: "!inputs.test_pypi"
        uses: pypa/gh-action-pypi-publish@release/v1
