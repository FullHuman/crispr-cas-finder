name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-29
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-07-29 --profile minimal --component rustfmt --component clippy

      - name: Show active Rust toolchain
        run: rustup show active-toolchain

      - name: Verify release notices and toolchain copies
        run: python scripts/sync_release_metadata.py --check

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nightly-2026-07-29-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose --workspace --all-features

      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-features

      - name: Build threaded WASM
        if: matrix.os == 'ubuntu-latest'
        run: ./build_wasm.sh

      - name: Test model bundling
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s crispr-cas-finder-wasm/tests -p 'test_*.py'

      - name: Test relocated CLI with embedded models
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --locked --release -p crispr-cas-finder-cli
          python3 scripts/test_cli_distribution.py target/release/crispr-cas-finder --report "$RUNNER_TEMP/native-report.json"

      - name: Set up Node for browser regression checks
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install browser test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci --prefix crispr-cas-finder-wasm/tests
          npx --prefix crispr-cas-finder-wasm/tests playwright install --with-deps chromium webkit

      - name: Test Chromium and WebKit against native results
        if: matrix.os == 'ubuntu-latest'
        env:
          SMOKE_NATIVE_REPORT: ${{ runner.temp }}/native-report.json
        run: |
          node crispr-cas-finder-wasm/tests/browser-smoke.cjs
          SMOKE_BROWSER=webkit node crispr-cas-finder-wasm/tests/browser-smoke.cjs

      - name: Verify public crate packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/package_public_crates.py

  python:
    name: Python distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python build backend
        run: python -m pip install "maturin>=1.9,<2"
      - name: Test source archive and installed wheel outside checkout
        run: python scripts/test_python_distribution.py

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run security audit
        run: cargo audit
      - name: Audit Python binding dependencies
        run: cargo audit --file crispr-cas-finder-python/Cargo.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Audit browser test dependencies
        run: npm audit --prefix crispr-cas-finder-wasm/tests --audit-level=high
