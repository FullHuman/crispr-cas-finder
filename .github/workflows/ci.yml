name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-29
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-07-29 --profile minimal --component rustfmt --component clippy

      - name: Show active Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nightly-2026-07-29-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose --workspace --all-features

      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-features

      - name: Build threaded WASM
        if: matrix.os == 'ubuntu-latest'
        run: ./build_wasm.sh

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run security audit
        run: cargo audit
      - name: Audit Python binding dependencies
        run: cargo audit --file crispr-cas-finder-python/Cargo.lock
