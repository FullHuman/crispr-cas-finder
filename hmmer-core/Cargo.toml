[package]
name = "hmmer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HMMER profile HMM algorithms — core library"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
bitflags = "2"
thiserror = "2"
rayon = "1.11"
ndarray = "0.17"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hmmer_benchmarks"
harness = false
