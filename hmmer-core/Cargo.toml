[package]
name = "hmmer-core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HMMER profile HMM algorithms — core library"

[features]
default = []
serde = ["crispr-cas-finder-core/hmmer-serde"]

[dependencies]
crispr-cas-finder-core = { path = "../crispr-cas-finder-core" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "hmmer_benchmarks"
harness = false
