[package]
name = "crispr-cas-finder-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for crispr-cas-finder-core"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crispr-cas-finder-core = { path = "../crispr-cas-finder-core" }
orphos-core = "0.3.0"
hmmer-core = { path = "../hmmer-core" }
hmmer-io = { path = "../hmmer-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# bio still pulls getrandom 0.2; enable its WASM backend too.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
bio = "4"
rayon = "1.11"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
web-sys = { version = "0.3", features = ["console"] }
