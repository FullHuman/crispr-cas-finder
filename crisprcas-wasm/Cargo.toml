[package]
name = "crisprcas-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for crisprcas-core"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crisprcas-core = { path = "../crisprcas-core" }
orphos-core = "0.2.0"
hmmer-core = { path = "../hmmer-core" }
hmmer-io = { path = "../hmmer-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
bio = "3"
rayon = "1.11"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
web-sys = { version = "0.3", features = ["console"] }
